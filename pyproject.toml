[project]
name = "namer"
version = "0.1.0"
description = "Batch rename files: strip/add prefixes, number, and normalize case"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
namer = "namer.gui:run"

[dependency-groups]
dev = ["pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["namer"]
